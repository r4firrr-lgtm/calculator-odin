<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    </head>
    <body>
    <div id="calculator">
        <h1>Calculator-JS</h1>
        <div id="display"></div>
        <div id="first-row">
            <div id="one" class="number">1</div>
            <div id="two" class="number">2</div>
            <div id="three" class="number">3</div>
            <div id="plus" class="operator">+</div>
        </div>
        <div id="second-row">
            <div id="one" class="number">4</div>
            <div id="two" class="number">5</div>
            <div id="three" class="number">6</div>
            <div id="minus" class="operator">-</div >
        </div>
        <div id="third-row">
            <div id="seven" class="number">7</div>
            <div id="eight" class="number">8</div>
            <div id="nine" class="number">9</div>
            <div id="multiply" class="operator">x</div>
        </div>
        <div id="fourth-row">
            <div id="clear" class="number">c</div>
            <div id="zero" class="number">0</div>
            <div id="equals" class="number">=</div>
            <div id="divide" class="operator">/</div>
        </div>
        <div id="fifth-row">
            <div id="decimal" class="number">.</div>
            <div id="backspace" class="number">
                 <i class="fa-solid fa-delete-left"></i>
            </div>
            <div id="empty-button"></div>
            <div id="percentage" class="operator">%</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
